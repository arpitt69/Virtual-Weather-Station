jection counter and vice versa, and a transition clears neither, so "clean run &gt;= 25"</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="518" x="427.5" y="331.9512">is the total length needed to confirm a recovery, not a further 25 on top of the 10.</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="0" x="431.5" y="345.9199"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="534" x="427.5" y="359.8887">The rate rule exists because the run rules have a blind spot. A sensor spiking 40% of</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="540" x="427.5" y="373.8574">the time rejects about a third of its samples and is plainly broken, but eight rejections</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="525" x="427.5" y="387.8262">in a row has probability 0.4^8 - about 0.4 occurrences in 600 samples - so it merely</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="536" x="427.5" y="401.7949">oscillated between OK and SUSPECT. The rate rule only escalates; recovery stays with</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="57" x="427.5" y="415.7637">the runs.</text><!--MD5=[3c0643cd8580055f39f7e0b15c117460]
@startuml 04-state-health
skinparam backgroundColor #FFFFFF
skinparam shadowing false
skinparam defaultFontName "DejaVu Sans"
skinparam defaultFontSize 12
skinparam roundCorner 6
skinparam ArrowColor #44546A
skinparam NoteBackgroundColor #FFF8DC
skinparam NoteBorderColor #C9A227

skinparam class {
  BackgroundColor #F4F7FB
  BorderColor #44546A
  ArrowColor #44546A
  AttributeFontSize 11
  StereotypeFontSize 10
}
skinparam package {
  BackgroundColor #EDF1F7
  BorderColor #8496B0
  FontStyle bold
}
skinparam sequence {
  ArrowColor #44546A
  LifeLineBorderColor #8496B0
  LifeLineBackgroundColor #E3EAF4
  ParticipantBackgroundColor #F4F7FB
  ParticipantBorderColor #44546A
  BoxBackgroundColor #EDF1F7
  BoxBorderColor #8496B0
  DividerBackgroundColor #DCE4F0
}
skinparam state {
  BackgroundColor #F4F7FB
  BorderColor #44546A
  FontStyle bold
}
skinparam component {
  BackgroundColor #F4F7FB
  BorderColor #44546A
}
skinparam database {
  BackgroundColor #F4F7FB
  BorderColor #44546A
}
title Virtual Weather Station - Sensor health state machine (SensorHealthMonitor)

left to right direction

[*] - -> OK

OK         : usable() == true
SUSPECT    : usable() == true
RECOVERING : usable() == true\n(on probation)
FAULTY     : usable() == false\ncontributes to no estimate

OK - -> SUSPECT : rejection run >= 3\nor silent >= 6 sample periods\nor > 10% of last 64 rejected
OK - -> FAULTY  : 12 identical readings,\nnot at a range limit  <<stuck>>\nor > 25% of last 64 rejected

SUSPECT - -> FAULTY : rejection run >= 8\nor silent >= 20 sample periods\nor > 25% of last 64 rejected
SUSPECT - -> OK     : clean run >= 10

FAULTY     - -> RECOVERING : clean run >= 10
RECOVERING - -> OK         : clean run >= 25
RECOVERING - -> FAULTY     : any rejection\nduring probation

legend bottom
  Only FAULTY is excluded from fusion. SUSPECT means "watch this one": the variance
  estimate has already cut the weight of a sensor misbehaving enough to matter.

  Every threshold counts an uninterrupted **run**. One accepted reading clears the
  rejection counter and vice versa, and a transition clears neither, so "clean run >= 25"
  is the total length needed to confirm a recovery, not a further 25 on top of the 10.

  The rate rule exists because the run rules have a blind spot. A sensor spiking 40% of
  the time rejects about a third of its samples and is plainly broken, but eight rejections
  in a row has probability 0.4^8 - about 0.4 occurrences in 600 samples - so it merely
  oscillated between OK and SUSPECT. The rate rule only escalates; recovery stays with
  the runs.
end legend
@enduml

