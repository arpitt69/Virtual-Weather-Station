<svg xmlns="http://www.w3.org/2000/svg" width="860" height="713" viewBox="0 0 860 713" font-family="'DejaVu Sans Mono','JetBrains Mono','Liberation Mono','Courier New',monospace" font-size="12.5">
<rect width="100%" height="100%" rx="7" fill="#14141b"/>
<text x="14" y="21" fill="#8b949e" font-size="11.5">make unit - 92 offline checks: filters, health machine, derived metrics, fusion</text>
<text x="30.0" y="48.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="48.5" fill="#d9dee3" xml:space="preserve">  no slope before there is a baseline                                                             </text>
<text x="30.0" y="65.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="65.5" fill="#d9dee3" xml:space="preserve">  least-squares slope, hPa per simulated hour (-0.3350)                                           </text>
<text x="30.0" y="82.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="82.5" fill="#d9dee3" xml:space="preserve">  classified as falling                                                                           </text>
<text x="30.0" y="99.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="99.5" fill="#d9dee3" xml:space="preserve">  flat pressure is steady                                                                         </text>
<text x="14.0" y="133.5" fill="#ffffff" font-weight="bold" xml:space="preserve">FusionEngine</text>
<text x="30.0" y="150.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="150.5" fill="#d9dee3" xml:space="preserve">  publishes a valid snapshot                                                                      </text>
<text x="30.0" y="167.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="167.5" fill="#d9dee3" xml:space="preserve">  both temperature units contribute while healthy                                                 </text>
<text x="30.0" y="184.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="184.5" fill="#d9dee3" xml:space="preserve">  names its sources                                                                               </text>
<text x="30.0" y="201.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="201.5" fill="#d9dee3" xml:space="preserve">  inverse-variance fused temperature (19.9914)                                                    </text>
<text x="30.0" y="218.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="218.5" fill="#d9dee3" xml:space="preserve">  single-sensor channels pass through                                                             </text>
<text x="30.0" y="235.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="235.5" fill="#d9dee3" xml:space="preserve">  derived metrics present                                                                         </text>
<text x="30.0" y="252.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="252.5" fill="#d9dee3" xml:space="preserve">  the quieter unit carries more weight (0.982614 vs 0.017386)                                     </text>
<text x="30.0" y="269.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="269.5" fill="#d9dee3" xml:space="preserve">  temperature weights sum to 1 (1.0000)                                                           </text>
<text x="30.0" y="286.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="286.5" fill="#d9dee3" xml:space="preserve">  the noise estimate ranks the two units correctly                                                </text>
<text x="30.0" y="303.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="303.5" fill="#d9dee3" xml:space="preserve">  a biased noisy unit is pulled toward the quiet one, not the midpoint                            </text>
<text x="30.0" y="320.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="320.5" fill="#d9dee3" xml:space="preserve">  Kalman fused temperature (19.9881)                                                              </text>
<text x="30.0" y="337.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="337.5" fill="#d9dee3" xml:space="preserve">  Kalman reports a tighter sigma than either sensor                                               </text>
<text x="30.0" y="354.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="354.5" fill="#d9dee3" xml:space="preserve">  the wedged unit goes FAULTY                                                                     </text>
<text x="30.0" y="371.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="371.5" fill="#d9dee3" xml:space="preserve">  only the survivor contributes                                                                   </text>
<text x="30.0" y="388.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="388.5" fill="#d9dee3" xml:space="preserve">  the snapshot says it is on fallback                                                             </text>
<text x="30.0" y="405.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="405.5" fill="#d9dee3" xml:space="preserve">  the fused value follows the survivor, not the wedged unit                                       </text>
<text x="30.0" y="422.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="422.5" fill="#d9dee3" xml:space="preserve">  a FAULTY sensor carries no weight (0.0000)                                                      </text>
<text x="30.0" y="439.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="439.5" fill="#d9dee3" xml:space="preserve">  a sensor pinned at a range limit is not called stuck                                            </text>
<text x="30.0" y="456.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="456.5" fill="#d9dee3" xml:space="preserve">  no usable temperature sensor                                                                    </text>
<text x="30.0" y="473.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="473.5" fill="#d9dee3" xml:space="preserve">  says so explicitly                                                                              </text>
<text x="30.0" y="490.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="490.5" fill="#d9dee3" xml:space="preserve">  derived metrics are withheld without a temperature                                              </text>
<text x="30.0" y="507.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="507.5" fill="#d9dee3" xml:space="preserve">  a silent sensor is caught by staleness                                                          </text>
<text x="30.0" y="524.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="524.5" fill="#d9dee3" xml:space="preserve">  its channel is withheld from the snapshot                                                       </text>
<text x="30.0" y="541.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="541.5" fill="#d9dee3" xml:space="preserve">  the other channels are unaffected                                                               </text>
<text x="30.0" y="558.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="558.5" fill="#d9dee3" xml:space="preserve">  spikes are still caught at 40% contamination from a cold start (rejected 197/600)               </text>
<text x="30.0" y="575.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="575.5" fill="#d9dee3" xml:space="preserve">  a sensor spiking 40% of the time is condemned                                                   </text>
<text x="30.0" y="592.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="592.5" fill="#d9dee3" xml:space="preserve">  mode is readable                                                                                </text>
<text x="30.0" y="609.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="609.5" fill="#d9dee3" xml:space="preserve">  mode can be switched at runtime                                                                 </text>
<text x="30.0" y="626.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="626.5" fill="#d9dee3" xml:space="preserve">  a sensor disabled out-of-band stops contributing                                                </text>
<text x="30.0" y="643.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="643.5" fill="#d9dee3" xml:space="preserve">  fault state picked up from the descriptor                                                       </text>
<text x="30.0" y="660.5" fill="#4cc46a" xml:space="preserve">PASS</text>
<text x="62.0" y="660.5" fill="#d9dee3" xml:space="preserve">  a reading from an unknown sensor id is ignored                                                  </text>
<text x="14.0" y="694.5" fill="#ffffff" font-weight="bold" xml:space="preserve">92 passed, 0 failed</text>
</svg>